[package]
name = "opencode-awake-helper"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Power", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_System_SystemServices"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
